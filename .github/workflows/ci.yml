name: ChangeBlast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engine-validation:
    name: Engine Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting and style
        run: |
          ruff check .
          ruff format --check .

      - name: Run strict static type checking
        run: |
          mypy src tests

      - name: Validate JSON schemas
        run: |
          changeblast schema --model all

      - name: Run automated test suite with coverage
        run: |
          pytest tests/ --cov=changeblast --cov-report=term-missing -v

      - name: Verify strict read-only execution
        run: |
          pytest tests/unit/test_readonly_guarantee.py tests/unit/test_security_qa.py -v

  plugin-validation:
    name: Claude Code Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest and directory
        run: |
          claude plugin validate --strict .
          claude plugin validate --profile directory .
